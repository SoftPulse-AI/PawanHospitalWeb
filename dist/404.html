<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Pawan Hospital</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Poppins, Arial, sans-serif;
        background: radial-gradient(circle at 20% 20%, #e6f1ff 0%, #f8fbff 45%, #ffffff 100%);
        color: #10233e;
      }
      .card {
        width: min(92vw, 560px);
        border: 1px solid #dbe6f6;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(20, 60, 120, 0.12);
        padding: 32px 24px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #bfdbff;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        color: #0b5ed7;
        background: #eff6ff;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: clamp(34px, 7vw, 48px);
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: #55657f;
        line-height: 1.6;
        font-size: 15px;
      }
      .actions {
        margin-top: 22px;
      }
      a {
        display: inline-block;
        text-decoration: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #0b5ed7, #0ea5e9);
        box-shadow: 0 10px 24px rgba(11, 94, 215, 0.28);
      }
      a:hover {
        filter: brightness(1.03);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Pawan Hospital</div>
      <h1>404</h1>
      <p>Oops! The page you are trying to visit does not exist.</p>
      <p>Please return to the home page and continue browsing care services.</p>
      <div class="actions">
        <a href="./">Return to Home</a>
      </div>
    </main>
  </body>
 </html>
